name: Check Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'website-openai/**'
      - 'cloudflare-pages/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-pages.yml'
  pull_request:
    paths:
      - 'website-openai/**'
      - 'cloudflare-pages/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-pages/package-lock.json
      - run: npm ci
      - name: Build and verify Pages site
        run: npm run build
