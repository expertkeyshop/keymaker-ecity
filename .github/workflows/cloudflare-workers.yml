name: Deploy Cloudflare Workers backup

on:
  push:
    branches: [main]
    paths:
      - 'website-openai/**'
      - 'cloudflare-workers/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-workers.yml'
  pull_request:
    paths:
      - 'website-openai/**'
      - 'cloudflare-workers/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-workers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-workers/package-lock.json
      - run: npm ci
      - name: Build and verify backup site
        run: npm run build
      - name: Deploy existing backup Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: 4a83dba4a151d718dc868601708771f7
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set the CLOUDFLARE_WORKERS_API_TOKEN repository secret."; exit 1; }
          npm run deploy
      - name: Verify deployed backup
        if: github.event_name != 'pull_request'
        run: node ../scripts/verify-live.mjs https://keymaker.electronicity.workers.dev/ --backup
